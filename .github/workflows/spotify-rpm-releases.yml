name: Stable Spotify RPMs and COPR

on:
  schedule:
    - cron: '0 12,17 * * *'
      timezone: Europe/Stockholm
  workflow_dispatch:

permissions:
  contents: read

# One counter reservation/build/delivery at a time, including manual invocations.
concurrency:
  group: spotify-stable-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
      - name: Check stable DEB version and reserve packaging number
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          SPOTIFY_METADATA_DIR: ${{ runner.temp }}/spotify-metadata
        run: python3 tools/plan_release.py --event "$GITHUB_EVENT_NAME"
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.needed == 'true'
        with:
          name: spotify-stable-source-metadata
          path: ${{ runner.temp }}/spotify-metadata/spotify-client.stable.json

  build:
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SPOTIFY_RELEASE: ${{ needs.detect.outputs.release }}
      SPOTIFY_VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: spotify-stable-source-metadata
          path: metadata
      - name: Install packaging and scanning tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev clamav clamav-freshclam python3 binutils desktop-file-utils
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify DEB, refresh signatures, extract and scan all payloads
        env:
          SPOTIFY_METADATA_FILE: ${{ github.workspace }}/metadata/spotify-client.stable.json
        run: src/build_once.sh stable output
      - name: Build and check versioned x86_64 RPM
        run: |
          src/build_binary.sh output/spotify-*.src.rpm output
          test "$(rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}' output/spotify-*.x86_64.rpm)" = "spotify $SPOTIFY_VERSION-$SPOTIFY_RELEASE x86_64"
          cd output
          sha256sum spotify-*.rpm > SHA256SUMS
      - name: Save RPMs
        uses: actions/upload-artifact@v7
        with:
          name: spotify-stable-rpms
          path: |
            output/*.rpm
            output/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
      - name: Save scan and build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotify-stable-validation
          path: |
            output/scan-reports/
            output/rpm-build.log

  copr:
    needs: [detect, build]
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SPOTIFY_VERSION: ${{ needs.detect.outputs.version }}
      SPOTIFY_RELEASE: ${{ needs.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: spotify-stable-rpms
          path: assets
      - name: Install COPR client
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-venv
          python3 -m venv "$RUNNER_TEMP/copr-venv"
          "$RUNNER_TEMP/copr-venv/bin/pip" install copr-cli
          echo "$RUNNER_TEMP/copr-venv/bin" >> "$GITHUB_PATH"
      - name: Submit to enabled compatible COPR distributions and wait
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: bash tools/submit_copr.sh assets/spotify-*.src.rpm output
      - name: Save COPR submission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotify-copr-validation
          path: output/

  publish:
    needs: [detect, build, copr]
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: spotify-stable-rpms
          path: assets
      - name: Publish a separate stable release for this packaging number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          PACKAGING_RELEASE: ${{ needs.detect.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Official stable Spotify DEB repackaged as `spotify` for x86_64 Linux.
          The original DEB and extracted payload are scanned with freshly updated
          ClamAV signatures, heuristic and potentially unwanted application detection.
          A detection, encrypted/unreadable content, scan error or scan limit stops packaging.
          COPR submission to the currently enabled compatible targets completed successfully.

          Install with `sudo dnf install ./spotify-*.x86_64.rpm` and start with `spotify`.
          Use `spotify --debug` for terminal diagnostics.
          Runtime requirements follow the official DEB and the RPM's listed libraries.
          GitHub RPMs are unsigned; SHA256SUMS supplies integrity checks.
          Scan, build and COPR logs are available in the workflow artifacts.
          NOTES
          # The tag was atomically reserved before scanning; never move/reuse it.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --title "Spotify $VERSION-$PACKAGING_RELEASE" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" assets/* --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest \
            --title "Spotify $VERSION-$PACKAGING_RELEASE" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Generate download graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/download_stats.py
      - uses: actions/upload-artifact@v7
        with:
          name: spotify-download-statistics
          path: |
            output/download-stats.html
            output/download-stats.json
