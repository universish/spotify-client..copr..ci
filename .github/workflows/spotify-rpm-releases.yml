name: Build and publish stable Spotify x86_64 RPMs

on:
  push:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/spotify-rpm-releases.yml
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: Rebuild and replace this stable version's assets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spotify-stable-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect stable version and retain exact source metadata
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force_release || false }}
          SPOTIFY_METADATA_DIR: ${{ runner.temp }}/spotify-metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 src/parser_debian_control_file.py stable spotify-client Version
          version=$(cat "$SPOTIFY_METADATA_DIR/spotify-client.stable.Version")
          tag="v${version}-2"
          needed=true
          if [[ "$FORCE_RELEASE" != true ]]; then
            if release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets 2>/dev/null); then
              if jq -e '(.isDraft == false) and (.isPrerelease == false) and any(.assets[]; .name | endswith(".x86_64.rpm")) and any(.assets[]; .name | endswith(".src.rpm"))' <<< "$release" >/dev/null; then
                needed=false
              fi
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.needed == 'true'
        with:
          name: spotify-stable-source-metadata
          path: ${{ runner.temp }}/spotify-metadata/spotify-client.stable.json

  build:
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: spotify-stable-source-metadata
          path: metadata
      - name: Install packaging and scanning tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev clamav clamav-freshclam python3 binutils
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify DEB, refresh ClamAV, extract, scan and build SRPM
        env:
          SPOTIFY_METADATA_FILE: ${{ github.workspace }}/metadata/spotify-client.stable.json
        run: src/build_once.sh stable output
      - name: Build and check x86_64 RPM
        run: |
          src/build_binary.sh output/spotify-*.src.rpm output
          test "$(rpm -qp --qf '%{NAME} %{ARCH}' output/spotify-*.x86_64.rpm)" = 'spotify x86_64'
          cd output
          sha256sum spotify-*.rpm > SHA256SUMS
      - name: Save RPMs
        uses: actions/upload-artifact@v7
        with:
          name: spotify-stable-rpms
          path: |
            output/*.rpm
            output/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
      - name: Save scan and build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotify-stable-validation
          path: |
            output/scan-reports/
            output/rpm-build.log

  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: spotify-stable-rpms
          path: assets
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Official stable Spotify DEB repackaged as `spotify` for x86_64 Linux.
          The source's SHA256 is verified, ClamAV signatures are refreshed, and
          the extracted payload must scan clean before packaging.

          Install the binary RPM with `sudo dnf install ./spotify-*.x86_64.rpm`.
          Start with `spotify`; enable terminal diagnostics with `spotify --debug`.
          Runtime requirements follow the official DEB and the RPM's listed libraries.
          RPMs are unsigned; SHA256SUMS provides download integrity checks.
          Scan and build logs are available in this workflow's validation artifact.
          NOTES
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --title "Spotify $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" assets/* --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest \
            --title "Spotify $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Generate download graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/download_stats.py
      - uses: actions/upload-artifact@v7
        with:
          name: spotify-download-statistics
          path: |
            output/download-stats.html
            output/download-stats.json
