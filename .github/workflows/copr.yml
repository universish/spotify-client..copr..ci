name: Build scanned SRPM for COPR

on:
  workflow_dispatch:
    inputs:
      submit_to_copr:
        description: Submit to universish/Spotify..Client (review docs/copr.md first)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  srpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install packaging and scanning tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev clamav clamav-freshclam python3 binutils
      - name: Download, verify, extract, update signatures, scan and build
        run: src/build_once.sh stable output
      - name: Save SRPM and scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotify-srpm-and-scan-reports
          path: output/
      - name: Submit candidate targets to COPR
        if: inputs.submit_to_copr
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COPR_CONFIG"
          python3 -m venv "$RUNNER_TEMP/copr-venv"
          "$RUNNER_TEMP/copr-venv/bin/pip" install copr-cli
          umask 077
          printf '%s\n' "$COPR_CONFIG" > "$RUNNER_TEMP/copr.conf"
          trap 'rm -f "$RUNNER_TEMP/copr.conf"' EXIT
          args=()
          while IFS= read -r chroot; do args+=(--chroot "$chroot"); done < <(python3 tools/targets.py --candidates --live)
          test "${#args[@]}" -gt 0
          "$RUNNER_TEMP/copr-venv/bin/copr-cli" --config "$RUNNER_TEMP/copr.conf" build \
            "${args[@]}" universish/Spotify..Client output/spotify-*.src.rpm
